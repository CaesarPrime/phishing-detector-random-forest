<!doctype html><html><head><meta charset="utf-8"><title>Detection History</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"></head><body>
<div class="card"><h1>Detection History</h1>
<table><tr><th>ID</th><th>URL</th><th>Result</th><th>Date Checked</th></tr>
{% for row in rows %}<tr><td>{{ row[0] }}</td><td>{{ row[1] }}</td>
<td class="{{ 'phish' if row[2] == phishing else 'legit' }}">{{ row[2] }}</td><td>{{ row[3] }}</td></tr>
{% else %}<tr><td colspan="4">No URLs checked yet.</td></tr>{% endfor %}</table>
<a href="{{ url_for('home') }}">Back Home</a></div></body></html>
